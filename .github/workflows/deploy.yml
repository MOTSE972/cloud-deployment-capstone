on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloud-capstone
  EC2_INSTANCE_ID: i-0bf53b4a0a340c4c4
  CONTAINER_NAME: cloud-capstone-web
  APP_PORT: 5000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::985682977715:role/GitHubActions-Capstone-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .

          docker tag \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy application to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"cd /home/ssm-user/cloud-deployment-capstone\",
              \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest\",
              \"sudo docker-compose down\",
              \"sudo docker-compose up -d\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "EC2 deployment completed successfully."
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"

              exit 1
            fi

            sleep 10
          done

      - name: Verify ECR image
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Get EC2 public IP
        run: |
          EC2_PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> "$GITHUB_ENV"

          echo "EC2 Public IP: $EC2_PUBLIC_IP"

      - name: Wait for application startup
        run: |
          echo "Waiting for application to start..."
          sleep 15

      - name: Verify application health
        run: |
          echo "Checking application health..."

          RESPONSE=$(curl --silent --show-error \
            --fail \
            --max-time 10 \
            "http://$EC2_PUBLIC_IP:$APP_PORT/health")

          echo "Health response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"status": "healthy"'

          echo "Application health check passed."

      - name: Verify database connection
        run: |
          echo "Checking database connection..."

          RESPONSE=$(curl --silent --show-error \
            --fail \
            --max-time 10 \
            "http://$EC2_PUBLIC_IP:$APP_PORT/database")

          echo "Database response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"status": "connected"'

          echo "Database connection check passed."

      - name: Deployment complete
        run: |
          echo "=========================================="
          echo "Cloud Capstone deployment completed."
          echo "Application health: HEALTHY"
          echo "Database connection: CONNECTED"
          echo "Docker deployment: SUCCESS"
          echo "=========================================="        